<article class="card"><a class="card-image" href="{{ .RelPermalink }}" tabindex="-1" aria-hidden="true">{{ with .Params.image }}<img src="{{ . }}" alt="" loading="lazy">{{ else }}<span class="image-placeholder">&lt; / &gt;</span>{{ end }}</a><div class="card-body"><div class="card-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "2. January 2006" }}</time>{{ if eq .Type "posts" }}{{ partial "authors.html" . }}{{ end }}</div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Summary | plainify | truncate 170 }}</p><a class="read-more" href="{{ .RelPermalink }}">Læs mere →</a></div></article>
